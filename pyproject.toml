[project]
name = "mcp-spotify"
version = "0.1.0"
description = "MCP server for Spotify playlist building and playback control"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Matthew O'Brien", email = "obrien.mlotwis@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["mcp", "spotify", "playlist", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.27.0,<2",
    "spotipy>=2.24.0",
]

[project.urls]
Repository = "https://github.com/obrien-matthew/mcp-spotify"
Issues = "https://github.com/obrien-matthew/mcp-spotify/issues"

[tool.uv.build-backend]
module-name = "spotify_mcp"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
mcp-spotify = "spotify_mcp:main"
