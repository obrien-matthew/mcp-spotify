[project]
name = "mcp-spotify"
version = "0.1.5"
description = "MCP server for Spotify playlist building and playback control"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Matthew O'Brien", email = "obrien.mlotwis@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["mcp", "spotify", "playlist", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.27.0,<2",
    "spotipy>=2.24.0",
]

[project.urls]
Repository = "https://github.com/obrien-matthew/mcp-spotify"
Issues = "https://github.com/obrien-matthew/mcp-spotify/issues"

[tool.uv.build-backend]
module-name = "spotify_mcp"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["spotify_mcp"]
omit = ["src/spotify_mcp/auth.py"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[project.scripts]
mcp-spotify = "spotify_mcp:main"
